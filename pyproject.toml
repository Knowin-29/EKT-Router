[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowinrouter"
version = "0.2.0"
description = "Bounded joint routing of experts, knowledge, and tools for embodied vision-language models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "torch>=2.1",
]

[project.optional-dependencies]
full = [
  "accelerate>=0.34",
  "datasets>=2.19",
  "pandas>=2.1",
  "faiss-cpu>=1.7.4",
  "peft>=0.17,<1",
  "Pillow>=10.0",
  "qwen-vl-utils>=0.0.14",
  "sentence-transformers>=2.7",
  "transformers>=4.57,<6",
]
ocr = ["pytesseract>=0.3.13", "Pillow>=10"]
train = ["ms-swift>=4.0,<5"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["modules*", "tools*", "eval*", "judge*", "train*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
