expert: spatial_reasoning
name: Spatial Reasoning
model_path: ${KNOWINROUTER_BACKBONE}
data_path: data/specialists/spatial_reasoning.jsonl
output_dir: checkpoints/experts/spatial_reasoning

tuner_type: lora
lora_rank: 128
lora_alpha: 256
lora_dropout: 0.05
target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
freeze_vision_tower: true
freeze_aligner: true
torch_dtype: bfloat16
num_train_epochs: 2
per_device_train_batch_size: 1
gradient_accumulation_steps: 2
learning_rate: 1.0e-4
weight_decay: 0.1
lr_scheduler_type: cosine
warmup_ratio: 0.05
max_length: 32768
gradient_checkpointing: true
val_ratio: 0.001
seed: 42
data_seed: 42
