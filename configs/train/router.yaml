train_path: data/router/train.jsonl
validation_path: data/router/validation.jsonl
output_dir: checkpoints/router
descriptor: Qwen/Qwen3-VL-2B-Instruct

query_dim: 2048
signature_dim: 3
action_dim: 8
hidden_dim: 256
interaction_rank: 64
verifier_hidden_dim: 128

optimizer: adamw
learning_rate: 1.0e-3
weight_decay: 0.0
batch_size: 256
epochs: 10
seed: 42
media_disjoint_split: true
train_samples: 1020
validation_samples: 180

knowledge_actions: [none, template, rag]
tool_actions: [none, depth, ground, ocr]
action_costs: {knowledge:template: 0.05, knowledge:rag: 0.1, tool:depth: 0.1, tool:ground: 0.1, tool:ocr: 0.1}
# Starting operating point; tune only on held-out routing probes and freeze before evaluation.
operating_point:
  tool_budget: 2.0
  max_provider_calls: 3
  tool_costs: {depth: 1.0, ground: 1.0, ocr: 1.0}
  commit_margin: 0.0
  min_coverage: 0.0
  min_confidence: 0.0
  max_ambiguity: 1.0
  require_provenance: true
